spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/transactions/**
        - id: beneficiary-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/beneficiaries/**
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**
        - id: officer-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/officers/**
        - id: kyc-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/kyc/**
        - id: loan-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/loans/**
        - id: support-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/support/**
        - id: notification-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notifications/**
        - id: audit-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/audits/**
      default-filters:
        - RemoveRequestHeader=Cookie
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never