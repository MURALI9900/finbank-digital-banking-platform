spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finbank
    username: finbank
    password: finbank
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8085

app:
  jwt:
    secret: finbank-development-secret-key-change-in-production-256-bits
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info