spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finbank}
    username: ${POSTGRES_USER:finbank}
    password: ${POSTGRES_PASSWORD:finbank}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8085

app:
  jwt:
    secret: ${FINBANK_JWT_SECRET:finbank-development-secret-key-change-in-production-256-bits}
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info