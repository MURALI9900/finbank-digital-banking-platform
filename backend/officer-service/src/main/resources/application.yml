spring:
  application:
    name: officer-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finbank}
    username: ${POSTGRES_USER:finbank}
    password: ${POSTGRES_PASSWORD:finbank}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8086

finbank:
  internal:
    service-token: ${FINBANK_INTERNAL_SERVICE_TOKEN:dev-internal-token}
  services:
    beneficiary-url: ${FINBANK_BENEFICIARY_SERVICE_URL:http://localhost:8084}
    kyc-url: ${FINBANK_KYC_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${FINBANK_JWT_SECRET:finbank-development-secret-key-change-in-production-256-bits}
