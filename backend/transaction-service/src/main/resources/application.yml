spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finbank}
    username: ${POSTGRES_USER:finbank}
    password: ${POSTGRES_PASSWORD:finbank}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8083

finbank:
  internal:
    service-token: ${FINBANK_INTERNAL_SERVICE_TOKEN:dev-internal-token}
  services:
    account-url: ${FINBANK_ACCOUNT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
