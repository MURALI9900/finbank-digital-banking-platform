spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finbank
    username: finbank
    password: finbank
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8091
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
spring:
  kafka:
    bootstrap-servers: localhost:9092
