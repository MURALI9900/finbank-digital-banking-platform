spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5432/finbank
    username: finbank
    password: finbank

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
