name: FinBank Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-service
          - account-service
          - transaction-service
          - beneficiary-service
          - auth-service
          - officer-service
          - kyc-service
          - loan-service
          - support-service
          - notification-service
          - audit-service
          - api-gateway
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B test
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Docker Compose
        run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-service
          - account-service
          - transaction-service
          - beneficiary-service
          - auth-service
          - officer-service
          - kyc-service
          - loan-service
          - support-service
          - notification-service
          - audit-service
          - api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t finbank/${{ matrix.service }}:ci .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Angular application
        run: npm run build
      - name: Build frontend Docker image
        run: docker build -t finbank/frontend:ci .
